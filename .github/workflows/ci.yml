name: Verify MuJoCo Console source bundle

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble and verify source archive
        run: |
          bash scripts/assemble-source.sh
          mkdir -p .build/mujoco-console
          tar -xJf release/mujoco-console-source.tar.xz -C .build/mujoco-console
          # Fix the Uvicorn flag syntax in the extracted project before validation.
          sed -i 's/"--proxy-headers", "false"/"--no-proxy-headers"/' .build/mujoco-console/Dockerfile
      - name: Inspect source archive and deployment files
        run: |
          echo "=== extracted project files ==="
          find .build/mujoco-console -maxdepth 5 -type f -printf '%P\\n' | sort
          echo "=== project README and deployment manifests ==="
          cd .build/mujoco-console
          for f in README.md .env.example requirements.txt requirements-robotics.txt Dockerfile compose.yaml scripts/deploy.sh scripts/smoke_test.py; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -n '1,240p' "$f"
            fi
          done
          echo "=== core runtime and tests ==="
          for f in app/worker.py app/trainer.py app/env_factory.py app/catalog.py app/custom_env.py tests/test_catalog.py tests/test_api.py tests/test_integration.py; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -n '1,260p' "$f"
            fi
          done
      - name: Install lightweight test dependencies
        run: python -m pip install fastapi uvicorn httpx pytest
      - name: Verify Uvicorn launch option
        run: |
          grep -q '"--no-proxy-headers"' .build/mujoco-console/Dockerfile
          ! grep -q '"--proxy-headers", "false"' .build/mujoco-console/Dockerfile
          cat >/tmp/asgi_probe.py <<'PY'
          async def app(scope, receive, send):
              if scope["type"] == "http":
                  await send({"type": "http.response.start", "status": 200, "headers": []})
                  await send({"type": "http.response.body", "body": b"ok"})
          PY
          set +e
          timeout 3s env PYTHONPATH=/tmp uvicorn asgi_probe:app --host 127.0.0.1 --port 0 --workers 1 --no-proxy-headers >/tmp/uvicorn-probe.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "Uvicorn failed to start with --no-proxy-headers (exit=$rc)"
            cat /tmp/uvicorn-probe.txt
            exit 1
          fi
      - name: Python syntax
        working-directory: .build/mujoco-console
        run: python -m compileall -q app tests scripts
      - name: Unit tests
        working-directory: .build/mujoco-console
        run: python -m pytest -q
      - name: JavaScript syntax
        working-directory: .build/mujoco-console
        run: node --check app/static/app.js
      - name: Shell syntax
        working-directory: .build/mujoco-console
        run: bash -n scripts/*.sh
      - name: Manifest schema JSON
        working-directory: .build/mujoco-console
        run: python -m json.tool schemas/environment.schema.json > /dev/null
      - name: Publish unpacked application source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f app/main.py ]; then
            echo "Application source already published"
            exit 0
          fi
          cp -a .build/mujoco-console/app .
          cp -a .build/mujoco-console/envs .
          cp -a .build/mujoco-console/tests .
          cp -a .build/mujoco-console/schemas .
          cp .build/mujoco-console/Dockerfile .
          cp .build/mujoco-console/compose.yaml .
          cp .build/mujoco-console/requirements.txt .
          cp .build/mujoco-console/requirements-robotics.txt .
          cp .build/mujoco-console/.env.example .
          cp .build/mujoco-console/.dockerignore .
          cp .build/mujoco-console/.gitignore .
          cp .build/mujoco-console/pytest.ini .
          install -D -m 755 .build/mujoco-console/scripts/deploy.sh scripts/deploy.sh
          install -D -m 755 .build/mujoco-console/scripts/smoke_test.py scripts/smoke_test.py
          install -D -m 755 .build/mujoco-console/scripts/import_menagerie.sh scripts/import_menagerie.sh
          git add app envs tests schemas Dockerfile compose.yaml requirements.txt requirements-robotics.txt .env.example .dockerignore .gitignore pytest.ini scripts/deploy.sh scripts/smoke_test.py scripts/import_menagerie.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish unpacked MuJoCo application source"
          git push origin HEAD:main
