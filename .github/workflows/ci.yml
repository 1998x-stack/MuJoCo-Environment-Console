name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install lightweight test dependencies
        run: |
          set -euo pipefail
          python -m pip install fastapi uvicorn httpx pytest jsonschema

      - name: Python syntax
        run: python -m compileall -q app tests scripts

      - name: Unit tests
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: JavaScript syntax
        run: node --check app/static/app.js

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Manifest schema JSON
        run: python -m json.tool schemas/environment.schema.json > /dev/null

      - name: Validate shipped environment manifests against the schema
        run: python scripts/validate_manifests.py

      - name: Prepare isolated container deployment
        run: |
          mkdir -p data/runs
          cat > .env <<EOF
          MUJOCO_CONSOLE_PASSWORD=ci-test-secret
          CONSOLE_PORT=18000
          MAX_VIEWERS=2
          INSTALL_ROBOTICS=1
          COOKIE_SECURE=0
          LOGIN_MAX_ATTEMPTS=8
          LOGIN_WINDOW_SECONDS=300
          SESSION_IDLE_SECONDS=60
          CONSOLE_UID=$(id -u)
          CONSOLE_GID=$(id -g)
          EOF
          chmod 600 .env
          docker compose config --quiet

      - name: Deploy using the documented production script
        run: bash scripts/deploy.sh

      - name: Verify pinned physics dependencies
        run: |
          docker compose exec -T console python - <<'PY'
          import importlib.metadata
          import mujoco
          assert mujoco.__version__ == '3.3.7', mujoco.__version__
          assert importlib.metadata.version('gymnasium-robotics') == '1.4.2'
          print(f"MuJoCo {mujoco.__version__}; Gymnasium Robotics {importlib.metadata.version('gymnasium-robotics')}")
          PY
          curl -fsS http://127.0.0.1:18000/healthz

      - name: Verify authenticated API and MJPEG viewer
        run: |
          set -euo pipefail
          curl -fsS -c /tmp/mujoco-cookies \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-test-secret"}' \
            http://127.0.0.1:18000/api/login
          curl -fsS -b /tmp/mujoco-cookies \
            http://127.0.0.1:18000/api/catalog > /tmp/mujoco-catalog.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/mujoco-catalog.json'))
          envs = data['environments']
          by_id = {e['id']: e for e in envs}
          required = {'gym:Hopper-v5', 'fetch:FetchReach-v4', 'custom:custom_pendulum',
                      'custom:custom_double_pendulum', 'custom:scene_demo_viewer'}
          assert required.issubset(by_id), required - by_id.keys()
          assert all(by_id[env_id]['installed'] for env_id in required)
          assert by_id['custom:scene_demo_viewer']['trainable'] is False
          assert by_id['custom:custom_double_pendulum']['trainable'] is True
          assert len(by_id) == len(envs), 'duplicate environment IDs'
          print(f"Catalog OK: {len(envs)} discovered environments; required core set installed")
          PY
          sid="$(curl -fsS -b /tmp/mujoco-cookies \
            -H 'Content-Type: application/json' \
            -d '{"env_id":"gym:InvertedPendulum-v5"}' \
            http://127.0.0.1:18000/api/sessions | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          set +e
          curl --max-time 5 -sS -b /tmp/mujoco-cookies \
            "http://127.0.0.1:18000/api/sessions/${sid}/stream" \
            -o /tmp/mujoco-stream.bin
          stream_rc=$?
          set -e
          if [[ "$stream_rc" -ne 0 && "$stream_rc" -ne 28 ]]; then
            echo "MJPEG stream request failed: $stream_rc" >&2
            exit "$stream_rc"
          fi
          test -s /tmp/mujoco-stream.bin
          grep -a -q 'Content-Type: image/jpeg' /tmp/mujoco-stream.bin
          python - <<'PY'
          data = open('/tmp/mujoco-stream.bin', 'rb').read()
          assert data.count(b'--frame') >= 1, 'no MJPEG boundary in the stream'
          assert b'\\r\\n--frame' not in data, 'boundary uses an escaped literal instead of CRLF'
          assert b'\r\n--frame' in data, 'MJPEG parts are not CRLF-delimited (RFC 2046)'
          print(f"MJPEG framing OK: {data.count(b'--frame')} CRLF-delimited boundaries")
          PY
          curl -fsS -b /tmp/mujoco-cookies -X POST \
            "http://127.0.0.1:18000/api/sessions/${sid}/stop"

      - name: Verify the shipped image carries its manifests and schema
        run: |
          # No bind mount on purpose: this must exercise the image's own /app copy. A missing
          # schemas/ used to disable every manifest check while the API still reported
          # "0 problems" (MJC-P3-110).
          set -euo pipefail
          docker run --rm mujoco-environment-console:local python scripts/validate_manifests.py
          docker run --rm mujoco-environment-console:local python -c \
            "from app import catalog; s = catalog.schema_status(); assert s['available'], s; print('image manifest schema OK:', s['path'])"

      - name: Verify physics, offscreen rendering, PPO and SAC
        run: |
          set -euo pipefail
          docker compose exec -T console python scripts/smoke_test.py --render --all
          timeout 600 docker compose exec -T console python scripts/training_smoke_test.py

      - name: Run the full test suite inside the deployed image
        run: |
          # GitHub's default bash has no pipefail, so `docker run ... | tee` would hide a
          # non-zero pytest exit status. Everything here must fail the job on failure, error,
          # timeout, or a collection error, and the verdict comes from structured JUnit XML.
          set -euo pipefail
          mkdir -p .artifacts/ci-pytest
          report=.artifacts/ci-pytest/junit.xml
          rm -f "$report"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "=== test log tail ==="; tail -n 60 /tmp/full-pytest.log || true; fi; exit $rc' EXIT
          timeout 900 docker run --rm --user 0:0 -e HOME=/tmp -e CONSOLE_TEST_REQUIRE_PHYSICS=1 \
            -v "$PWD":/work -w /work mujoco-environment-console:local \
            sh -c 'export DEBIAN_FRONTEND=noninteractive; \
                   apt-get update -qq && apt-get install -y -qq --no-install-recommends git && \
                   git config --global --add safe.directory /work && \
                   pip install --quiet --no-cache-dir httpx pytest jsonschema && \
                   python -m pytest -q -rs -p no:cacheprovider --junit-xml=/work/.artifacts/ci-pytest/junit.xml' \
            | tee /tmp/full-pytest.log
          python scripts/check_pytest_report.py "$report" /tmp/full-pytest.log

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --tail=200 console || true

      - name: Cleanup
        if: always()
        run: |
          docker compose down --remove-orphans || true
          rm -f .env
          rm -rf data/runs
