name: Verify MuJoCo Console source bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble and verify source archive
        run: |
          bash scripts/assemble-source.sh
          tar -xJf release/mujoco-console-source.tar.xz --exclude=.github
      - name: Inventory extracted source
        run: |
          echo "=== extracted source tree ==="
          find . -maxdepth 5 -type f ! -path './.git/*' ! -path './release/mujoco-console-source.tar.xz' -printf '%P\\n' | sort
          echo "=== deployment manifests ==="
          for f in Dockerfile docker-compose.yml docker-compose.yaml compose.yml compose.yaml pyproject.toml requirements.txt .dockerignore scripts/deploy.sh scripts/smoke_test.py; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -n '1,240p' "$f"
            fi
          done
      - name: Install lightweight test dependencies
        run: python -m pip install fastapi uvicorn httpx pytest
      - name: Python syntax
        run: python -m compileall -q app tests scripts
      - name: Unit tests
        run: python -m pytest -q
      - name: JavaScript syntax
        run: node --check app/static/app.js
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Manifest schema JSON
        run: python -m json.tool schemas/environment.schema.json > /dev/null
