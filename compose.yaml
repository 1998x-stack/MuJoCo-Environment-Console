services:
  console:
    build:
      context: .
      args:
        INSTALL_ROBOTICS: ${INSTALL_ROBOTICS:-1}
    image: mujoco-environment-console:local
    container_name: mujoco-console
    init: true
    user: "${CONSOLE_UID:-1000}:${CONSOLE_GID:-1000}"
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CONSOLE_PORT:-8000}:8000"
    volumes:
      - ./envs:/app/envs:ro
      - ./data:/app/data
    shm_size: 1gb
    pids_limit: 512
    # Opt-in caps. Leave unset (0) for the historical unlimited behaviour; set them when the
    # console shares a host with other services. Example: CONSOLE_CPU_LIMIT=10, CONSOLE_MEM_LIMIT=8g
    cpus: ${CONSOLE_CPU_LIMIT:-0}
    mem_limit: ${CONSOLE_MEM_LIMIT:-0}
    stop_grace_period: 40s
